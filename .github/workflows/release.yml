name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on the main branch. Aborting."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test XioApiExample.slnx -c Release

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file executable
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish XioApiExample/XioApiExample.csproj -c Release -r ${{ matrix.rid }} -p:Version="$VERSION" -o publish/${{ matrix.rid }}

      - name: Package
        run: |
          NAME="XioApiExample-${GITHUB_REF_NAME}-${{ matrix.rid }}"
          mkdir -p dist
          rm -f publish/${{ matrix.rid }}/*.pdb
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            (cd publish/${{ matrix.rid }} && zip -r "../../dist/$NAME.zip" .)
          else
            tar -czf "dist/$NAME.tar.gz" -C publish/${{ matrix.rid }} .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: XioApiExample-${{ matrix.rid }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
